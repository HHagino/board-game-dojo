<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>友だち対局を2人で試す</title>
<style>
body{margin:0;font:14px/1.5 sans-serif;background:#ddd}
#log{white-space:pre-wrap;margin:4px 8px;font-size:13px}
.two{display:flex;gap:8px;padding:0 8px}
iframe{width:390px;height:1500px;border:1px solid #999;background:#fff}
</style>
</head>
<body>
<!-- 試験用（公開しない）：同じページを2つ開き、偽の claude で1つの記録を共有して、作る→入る→指すを自動で回す。
     使い方＝リポジトリの根を 127.0.0.1 で配って開く（file:// では枠の中に手が届かない）。?game=othello&a=d3&b=c3 のように指定できる -->
<pre id="log">（動かしています…）</pre>
<div class="two"><iframe id="fa"></iframe><iframe id="fb"></iframe></div>
<script src="fake-claude.js"></script>
<script>
var q = new URLSearchParams(location.search);
var page = "../" + (q.get("game") || "othello") + "/index.html";
var store = FakeClaude.makeStore(); store.tick = 1500; // 札を取るたびに時計を 1.5 秒進める（相手の札の期限が切れる）
var fa = document.getElementById("fa"), fb = document.getElementById("fb"), logEl = document.getElementById("log"), lines = [];
function log(s){ lines.push(s); logEl.textContent = lines.join("\n"); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function W(f){ return f.contentWindow; }
function D(f){ return f.contentDocument; }
function btn(f, text){ return [].filter.call(D(f).querySelectorAll("#fpRoot button"), function(b){ return b.textContent === text; })[0]; }
function msg(f){ var m = D(f).getElementById("msg"); return m ? m.textContent.replace(/\n/g, " ／ ") : "（msg が無い）"; }
function setMode(f){ var s = D(f).getElementById("mode"); s.value = "net"; s.dispatchEvent(new Event("change")); }
function setName(f, n){ var i = D(f).querySelector("#fpRoot input"); i.value = n; btn(f, "名前を保存").click(); }
function loaded(f){ return new Promise(function(r){ f.onload = r; f.src = page; }); }
(async function(){
  await Promise.all([loaded(fa), loaded(fb)]);
  W(fa).claude = FakeClaude.makeClaude(store, {id: "u_a"});
  W(fb).claude = FakeClaude.makeClaude(store, {id: "u_b"});
  setMode(fa); setMode(fb); await wait(400);
  log("1 開いた直後  A：" + msg(fa) + "\n             B：" + msg(fb));
  setName(fa, "たろう"); setName(fb, "はなこ"); await wait(400);
  btn(fa, "作って待つ").click(); await wait(600);
  log("2 A が作った  A：" + msg(fa));
  var j = btn(fb, "参加する");
  log("  B の一覧に『参加する』：" + (j ? "ある" : "無い"));
  if (j) j.click();
  await wait(3500);
  log("3 B が入った  A：" + msg(fa) + "\n             B：" + msg(fb));
  // a・b＝押す升をカンマで並べる（例 a=e2,e4）。升は [data-sq="…"] で探す（オセロは data-i に読み替える）
  var mvA = q.get("a") || "d3", mvB = q.get("b") || "c3";
  function cellOf(f, sq){
    var e = D(f).querySelector('[data-sq="' + sq + '"]');
    if (!e && /^[a-h][1-8]$/.test(sq)) e = D(f).querySelector('.cell[data-i="' + ((+sq.charAt(1) - 1) * 8 + "abcdefgh".indexOf(sq.charAt(0))) + '"]');
    return e;
  }
  async function press(f, seq){
    var miss = [];
    for (var s of seq.split(",")){ var e = cellOf(f, s); if (e) e.click(); else miss.push(s); await wait(250); }
    if (miss.length) log("  ⚠️ 升が見つからない：" + miss.join(","));
  }
  await press(fb, mvA); await wait(800);
  var nB = store.docs[Object.keys(store.docs).filter(function(p){ return p.indexOf("games/") === 0; })[0]];
  log("  （対照）B が A の番に " + mvA + " を押した → 記録の手数 " + (nB ? nB.moves.length : "?") + "（0 なら正しく止まった）");
  await press(fa, mvA); await wait(3500);
  log("4 A が " + mvA + "  A：" + msg(fa) + "\n             B：" + msg(fb));
  await press(fb, mvB); await wait(3500);
  log("5 B が " + mvB + "  A：" + msg(fa) + "\n             B：" + msg(fb));
  btn(fb, "投了する").click(); await wait(300);
  log("6 B が投了を1回押す  B：" + [].map.call(D(fb).querySelectorAll(".fp-note"), function(x){ return x.textContent; }).join(" ／ "));
  btn(fb, "投了する").click(); await wait(3500);
  log("7 B が投了を2回押す  A：" + msg(fa) + "\n             B：" + msg(fb));
  btn(fa, "一覧へ戻る").click(); await wait(500);
  var rt = D(fa).querySelector(".fp-table");
  log("8 A の一覧のレーティング：" + (rt ? rt.textContent.replace(/\s+/g, " ") : "（表が無い）"));
  log("記録の手：" + JSON.stringify(nB && nB.moves) + "　状態：" + (nB && nB.status) + "　勝ち：" + (nB && nB.result && nB.result.winner));
  // 横のはみ出し（390px の枠で中身の幅が枠より広いか）と、写真を「友だちと対局」の所から撮るための送り
  [fa, fb].forEach(function(f, i){
    var de = D(f).documentElement, wide = [].filter.call(D(f).querySelectorAll("body *"), function(e){ var r = e.getBoundingClientRect(); return r.width && r.right > de.clientWidth + 1; });
    log("はみ出し " + "AB".charAt(i) + "：中身の幅 " + de.scrollWidth + "／枠 " + de.clientWidth + "・右にはみ出す要素 " + wide.length + (wide.length ? "（" + wide.slice(0, 3).map(function(e){ return e.tagName + "." + e.className; }).join("・") + "）" : ""));
  });
  btn(fb, "盤を見る") && btn(fb, "盤を見る").click(); await wait(300);
  [fa, fb].forEach(function(f){ var r = D(f).getElementById("fpRoot"); if (r) W(f).scrollTo(0, r.getBoundingClientRect().top + W(f).scrollY - 8); });
  log("DONE");
})().catch(function(e){ log("例外：" + (e && e.stack || e)); });
</script>
</body>
</html>
